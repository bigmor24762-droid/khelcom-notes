<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1B5E20">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="logo192.png">
    <title>Khelcom Aviculture PRO</title>
    <style>
        :root {
            --vert-fonce: #1B5E20;
            --vert: #2E7D32;
            --vert-clair: #C8E6C9;
            --bleu: #1976D2;
            --orange: #FF9800;
            --rouge: #d32f2f;
            --fond: #F1F8E9;
        }
        body {font-family: 'Segoe UI', Arial; background: var(--fond); margin: 0; padding: 0;}
       .header {background: linear-gradient(135deg, var(--vert-fonce), var(--vert)); color: white; padding: 15px; text-align: center; border-radius: 0 0 20px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
       .header img {width: 45px; height: 45px; vertical-align: middle; margin-right: 8px; border-radius: 50%;}
       .header h2 {display: inline; vertical-align: middle; font-size: 18px;}

        /* TABLEAU DE BORD */
       .dashboard {display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px;}
       .card {background: white; padding: 12px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); text-align: center;}
       .card h4 {margin: 0; font-size: 12px; color: #555;}
       .card p {margin: 5px 0 0 0; font-size: 20px; font-weight: bold; color: var(--vert-fonce);}

       .tabs {display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px;}
       .tab {padding: 10px 3px; background: white; border: 2px solid var(--vert-clair); color: var(--vert-fonce); font-weight: bold; font-size: 11px; border-radius: 12px; cursor: pointer;}
       .tab.active {background: var(--vert); color: white; border-color: var(--vert); transform: scale(1.03);}
       .content {background: white; padding: 15px; border-radius: 15px; margin: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);}
        textarea {width: 100%; height: 100px; border: 1px solid #ccc; border-radius: 8px; padding: 10px; font-size: 15px; box-sizing: border-box;}
       .btn-save {background: linear-gradient(135deg, var(--vert), var(--bleu)); color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; margin-top: 10px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 6px rgba(46,125,50,0.3);}
       .note {background: #ffffff; padding: 12px; border-radius: 10px; margin-top: 10px; border-left: 5px solid var(--orange); box-shadow: 0 1px 4px rgba(0,0,0,0.05);}
       .date {font-size: 12px; color: #555; font-weight: bold; margin-bottom: 5px;}
       .btn-actions {display:flex; gap:5px; margin-top:8px;}
       .btn-edit {background:var(--bleu); flex:1; color:white; border:none; padding:8px; border-radius:6px; font-size:12px; cursor:pointer;}
       .btn-delete {background:var(--rouge); flex:1; color:white; border:none; padding:8px; border-radius:6px; font-size:12px; cursor:pointer;}
       .resultat {color: var(--vert-fonce); font-weight: bold; margin-top: 5px;}
    </style>
</head>
<body>
    <div class="header"><img src="logo192.png" alt="Logo"><h2>KHELCOM AVICULTURE PRO</h2></div>

    <div class="dashboard" id="dashboard"></div>

    <div class="tabs">
        <button class="tab active" onclick="showTab('poulets')">🐔 POULETS</button>
        <button class="tab" onclick="showTab('aliment')">🌾 ALIMENT</button>
        <button class="tab" onclick="showTab('ventes')">💵 VENTES</button>
        <button class="tab" onclick="showTab('sante')">💉 SANTÉ</button>
        <button class="tab" onclick="showTab('depenses')">💰 DEPENSES</button>
        <button class="tab" onclick="showTab('notes')">📝 NOTES</button>
    </div>

    <div id="poulets" class="content">
        <h3>🐔 Nombre de Poulets</h3>
        <textarea id="notePoulets" placeholder="Ex: Arrivée: 500
Mortalité: 2"></textarea>
        <button class="btn-save" onclick="saveNote('poulets')">+ Enregistrer</button>
        <div id="listPoulets"></div>
    </div>

    <div id="aliment" class="content" style="display:none;">
        <h3>🌾 Aliment</h3>
        <textarea id="noteAliment" placeholder="Ex: Reçu: 20 sacs
Donné: 5 sacs"></textarea>
        <button class="btn-save" onclick="saveNote('aliment')">+ Enregistrer</button>
        <div id="listAliment"></div>
    </div>

    <div id="ventes" class="content" style="display:none;">
        <h3>💵 Ventes</h3>
        <textarea id="noteVentes" placeholder="Ex: Qté: 50
Prix: 3500F"></textarea>
        <button class="btn-save" onclick="saveNote('ventes')">+ Enregistrer</button>
        <div id="listVentes"></div>
    </div>

    <div id="sante" class="content" style="display:none;">
        <h3>💉 Santé / Vaccins</h3>
        <textarea id="noteSante" placeholder="Ex: Vaccin Newcastle fait"></textarea>
        <button class="btn-save" onclick="saveNote('sante')">+ Enregistrer</button>
        <div id="listSante"></div>
    </div>

    <div id="depenses" class="content" style="display:none;">
        <h3>💰 Dépenses</h3>
        <textarea id="noteDepenses" placeholder="Ex: Achat aliment: 150000F
Electricité: 25000F"></textarea>
        <button class="btn-save" onclick="saveNote('depenses')">+ Enregistrer</button>
        <div id="listDepenses"></div>
    </div>

    <div id="notes" class="content" style="display:none;">
        <h3>📝 Notes</h3>
        <textarea id="noteNotes" placeholder="Ex: Nettoyer le poulailler demain"></textarea>
        <button class="btn-save" onclick="saveNote('notes')">+ Enregistrer</button>
        <div id="listNotes"></div>
    </div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {navigator.serviceWorker.register('sw.js');});
}

function showTab(tab) {
  ['poulets', 'aliment', 'ventes', 'sante', 'depenses', 'notes'].forEach(t => {document.getElementById(t).style.display = 'none';});
  document.getElementById(tab).style.display = 'block';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  loadNotes();
}

function saveNote(type) {
  const typeName = type.charAt(0).toUpperCase() + type.slice(1);
  let text = document.getElementById('note' + typeName).value;
  if (text.trim() === '') return alert('Écris une note d\'abord');

  text = calculAuto(type, text); // CALCUL AUTO

  const date = new Date().toLocaleDateString('fr-FR') + ' ' + new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
  const note = {date: date, text: text, id: Date.now(), timestamp: Date.now()};

  let notes = JSON.parse(localStorage.getItem('khelcom_' + type)) || [];
  notes.unshift(note);
  localStorage.setItem('khelcom_' + type, JSON.stringify(notes));

  document.getElementById('note' + typeName).value = '';
  loadNotes();
  updateDashboard(); // Met à jour le tableau de bord
}

function calculAuto(type, text) {
  if(type === 'poulets') {
    let arrivee = parseInt(text.match(/arrivée[:\s]*(\d+)/i)?.[1] || 0);
    let mortalite = parseInt(text.match(/mortalité[:\s]*(\d+)/i)?.[1] || 0);
    if(arrivee > 0 || mortalite > 0) text += `\n✅ Total actuel: ${arrivee - mortalite} poulets`;
  }
  if(type === 'aliment') {
    let recu = parseInt(text.match(/reçu[:\s]*(\d+)/i)?.[1] || 0);
    let donne = parseInt(text.match(/donné[:\s]*(\d+)/i)?.[1] || 0);
    if(recu > 0 || donne > 0) text += `\n✅ Reste: ${recu - donne} sacs`;
  }
  if(type === 'ventes') {
    let qte = parseInt(text.match(/qt[ée]?[:\s]*(\d+)/i)?.[1] || 0);
    let prix = parseInt(text.match(/prix[:\s]*(\d+)/i)?.[1] || 0);
    if(qte > 0 && prix > 0) text += `\n✅ Total: ${(qte * prix).toLocaleString('fr-FR')} F`;
  }
  if(type === 'depenses') {
    let montants = text.match(/(\d+)\s*F/gi) || []; let total = 0; montants.forEach(m => total += parseInt(m));
    if(total > 0) text += `\n✅ Total: ${total.toLocaleString('fr-FR')} F`;
  }
  return text;
}

function loadNotes() {
  ['poulets', 'aliment', 'ventes', 'sante', 'depenses', 'notes'].forEach(type => {
    let notes = JSON.parse(localStorage.getItem('khelcom_' + type)) || [];
    let html = '';
    notes.forEach(n => {
      html += `
        <div class="note">
          <div class="date">${n.date}</div>
          ${n.text.replace(/\n/g, '<br>')}
          <div class="btn-actions">
            <button class="btn-edit" onclick="editNote('${type}', ${n.id})">✏️ Modifier</button>
            <button class="btn-delete" onclick="deleteNote('${type}', ${n.id})">🗑️ Supprimer</button>
          </div>
        </div>
      `;
    });
    const typeName = type.charAt(0).toUpperCase() + type.slice(1);
    document.getElementById('list' + typeName).innerHTML = html;
  });
}

function deleteNote(type, id) {
  if(confirm("Supprimer cette note?")) {
    let notes = JSON.parse(localStorage.getItem('khelcom_' + type)) || [];
    notes = notes.filter(n => n.id!== id);
    localStorage.setItem('khelcom_' + type, JSON.stringify(notes));
    loadNotes(); updateDashboard();
  }
}

function editNote(type, id) {
  let notes = JSON.parse(localStorage.getItem('khelcom_' + type)) || [];
  let note = notes.find(n => n.id === id);
  let newText = prompt("Modifier la note:", note.text.replace(/✅.*/g, '')); // enlève le calcul auto
  if(newText!== null && newText.trim()!== '') {
    note.text = calculAuto(type, newText);
    localStorage.setItem('khelcom_' + type, JSON.stringify(notes));
    loadNotes(); updateDashboard();
  }
}

// TABLEAU DE BORD AVEC TOTAUX DU MOIS
function updateDashboard() {
  let ventes = JSON.parse(localStorage.getItem('khelcom_ventes')) || [];
  let depenses = JSON.parse(localStorage.getItem('khelcom_depenses')) || [];
  let poulets = JSON.parse(localStorage.getItem('khelcom_poulets')) || [];

  let moisActuel = new Date().getMonth();
  let anneeActuelle = new Date().getFullYear();

  let totalVentes = 0;
  ventes.forEach(n => {
    let d = new Date(n.timestamp);
    if(d.getMonth() === moisActuel && d.getFullYear() === anneeActuelle) {
      let match = n.text.match(/Total: ([\d\s]+) F/);
      if(match) totalVentes += parseInt(match[1].replace(/\s/g, ''));
    }
  });

  let totalDepenses = 0;
  depenses.forEach(n => {
    let d = new Date(n.timestamp);
    if(d.getMonth() === moisActuel && d.getFullYear() === anneeActuelle) {
      let match = n.text.match(/Total: ([\d\s]+) F/);
      if(match) totalDepenses += parseInt(match[1].replace(/\s/g, ''));
    }
  });

  let benefice = totalVentes - totalDepenses;
  let dernierTotal = 0;
  if(poulets.length > 0) {
    let match = poulets[0].text.match(/Total actuel: (\d+) poulets/);
    if(match) dernierTotal = parseInt(match[1]);
  }

  document.getElementById('dashboard').innerHTML = `
    <div class="card"><h4>🐔 Total Poulets</h4><p>${dernierTotal}</p></div>
    <div class="card"><h4>💵 Ventes Mois</h4><p>${totalVentes.toLocaleString('fr-FR')} F</p></div>
    <div class="card"><h4>💰 Dépenses Mois</h4><p>${totalDepenses.toLocaleString('fr-FR')} F</p></div>
    <div class="card"><h4>📊 Bénéfice</h4><p style="color:${benefice >= 0? 'var(--vert)' : 'var(--rouge)'}">${benefice.toLocaleString('fr-FR')} F</p></div>
  `;
}

loadNotes(); updateDashboard();
</script>
</body>
</html>
