<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1B5E20">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="logo192.png">
    <title>Khelcom Aviculture GESTION</title>
    <style>
        :root {
            --vert-fonce: #1B5E20; --vert: #2E7D32; --vert-clair: #C8E6C9;
            --bleu: #1976D2; --orange: #FF9800; --rouge: #d32f2f; --fond: #F1F8E9;
        }
        body {font-family: 'Segoe UI', Arial; background: var(--fond); margin: 0; padding: 0;}
      .header {background: linear-gradient(135deg, var(--vert-fonce), var(--vert)); color: white; padding: 15px; text-align: center; border-radius: 0 0 20px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative;}
      .header img {width: 45px; height: 45px; vertical-align: middle; margin-right: 8px; border-radius: 50%;}
      .header h2 {display: inline; vertical-align: middle; font-size: 16px;}
      .btn-top {position: absolute; right: 10px; top: 15px; background: white; color: var(--vert); border: none; padding: 8px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer;}

      .dashboard {display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px;}
      .card {background: white; padding: 12px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); text-align: center;}
      .card h4 {margin: 0; font-size: 11px; color: #555;}
      .card p {margin: 5px 0 0 0; font-size: 18px; font-weight: bold; color: var(--vert-fonce);}

      .tabs {display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px;}
      .tab {padding: 10px 3px; background: white; border: 2px solid var(--vert-clair); color: var(--vert-fonce); font-weight: bold; font-size: 10px; border-radius: 12px; cursor: pointer;}
      .tab.active {background: var(--vert); color: white; border-color: var(--vert); transform: scale(1.03);}
      .content {background: white; padding: 15px; border-radius: 15px; margin: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);}
        textarea {width: 100%; height: 100px; border: 1px solid #ccc; border-radius: 8px; padding: 10px; font-size: 15px; box-sizing: border-box;}
      .btn-save {background: linear-gradient(135deg, var(--vert), var(--bleu)); color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; margin-top: 10px; font-size: 16px; font-weight: bold; cursor: pointer;}
      .btn-action2 {background: var(--orange); color: white; border: none; padding: 10px; width: 48%; border-radius: 10px; margin-top: 8px; font-size: 12px; font-weight: bold; cursor: pointer;}
      .note {background: #ffffff; padding: 12px; border-radius: 10px; margin-top: 10px; border-left: 5px solid var(--orange); box-shadow: 0 1px 4px rgba(0,0,0,0.05);}
      .date {font-size: 12px; color: #555; font-weight: bold; margin-bottom: 5px;}
      .btn-actions {display:flex; gap:5px; margin-top:8px;}
      .btn-edit {background:var(--bleu); flex:1; color:white; border:none; padding:8px; border-radius:6px; font-size:12px; cursor:pointer;}
      .btn-delete {background:var(--rouge); flex:1; color:white; border:none; padding:8px; border-radius:6px; font-size:12px; cursor:pointer;}
       canvas {width: 100%!important; height: 200px!important; margin-top: 10px;}
    </style>
</head>
<body>
    <div class="header">
        <img src="logo192.png" alt="Logo"><h2>KHELCOM GESTION AVICOLE</h2>
        <button class="btn-top" onclick="exporterTout()">📤 Sauvegarde</button>
    </div>

    <div class="dashboard" id="dashboard"></div>
    <div style="padding: 0 10px;"><canvas id="graphVentes"></canvas></div>

    <div class="tabs">
        <button class="tab active" onclick="showTab('poulets')">🐔 POULETS</button>
        <button class="tab" onclick="showTab('aliment')">🌾 ALIMENT</button>
        <button class="tab" onclick="showTab('ventes')">💵 VENTES</button>
        <button class="tab" onclick="showTab('sante')">💉 SANTÉ</button>
        <button class="tab" onclick="showTab('depenses')">💰 DEPENSES</button>
        <button class="tab" onclick="showTab('notes')">📝 NOTES</button>
    </div>

    <div id="poulets" class="content">
        <h3>🐔 Gestion Poulets</h3>
        <textarea id="notePoulets" placeholder="Ex: Arrivée: 500\nMortalité: 2\nVendu: 50"></textarea>
        <button class="btn-save" onclick="saveNote('poulets')">+ Enregistrer</button>
        <button class="btn-action2" onclick="exportPDF('poulets')">📄 Export PDF</button>
        <button class="btn-action2" onclick="vider('poulets')">🗑️ Vider</button>
        <div id="listPoulets"></div>
    </div>

    <div id="aliment" class="content" style="display:none;">
        <h3>🌾 Stock Aliment</h3>
        <textarea id="noteAliment" placeholder="Ex: Reçu: 20 sacs\nDonné: 5 sacs\nPrix sac: 18000F CFA"></textarea>
        <button class="btn-save" onclick="saveNote('aliment')">+ Enregistrer</button>
        <div id="listAliment"></div>
    </div>

    <div id="ventes" class="content" style="display:none;">
        <h3>💵 Ventes</h3>
        <textarea id="noteVentes" placeholder="Ex: Qté: 50\nPrix: 3500F CFA\nClient: Moussa"></textarea>
        <button class="btn-save" onclick="saveNote('ventes')">+ Enregistrer</button>
        <button class="btn-action2" onclick="exportPDF('ventes')">📄 Export PDF</button>
        <div id="listVentes"></div>
    </div>

    <div id="sante" class="content" style="display:none;">
        <h3>💉 Santé / Vaccins</h3>
        <textarea id="noteSante" placeholder="Ex: Vaccin Newcastle\nDate prochain: 15/10/2026\nCoût: 15000F CFA"></textarea>
        <button class="btn-save" onclick="saveNote('sante')">+ Enregistrer</button>
        <div id="listSante"></div>
    </div>

    <div id="depenses" class="content" style="display:none;">
        <h3>💰 Dépenses</h3>
        <textarea id="noteDepenses" placeholder="Ex: Achat aliment: 150000F CFA\nElectricité: 25000F CFA\nMain d'oeuvre: 50000F CFA"></textarea>
        <button class="btn-save" onclick="saveNote('depenses')">+ Enregistrer</button>
        <button class="btn-action2" onclick="exportPDF('depenses')">📄 Export PDF</button>
        <div id="listDepenses"></div>
    </div>

    <div id="notes" class="content" style="display:none;">
        <h3>📝 Notes & Rappels</h3>
        <textarea id="noteNotes" placeholder="Ex: Nettoyer le poulailler demain\nAcheter copeaux"></textarea>
        <button class="btn-save" onclick="saveNote('notes')">+ Enregistrer</button>
        <div id="listNotes"></div>
    </div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {navigator.serviceWorker.register('sw.js');});
}

function showTab(tab) {
  ['poulets', 'aliment', 'ventes', 'sante', 'depenses', 'notes'].forEach(t => {document.getElementById(t).style.display = 'none';});
  document.getElementById(tab).style.display = 'block';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  loadNotes();
}

function saveNote(type) {
  const typeName = type.charAt(0).toUpperCase() + type.slice(1);
  let text = document.getElementById('note' + typeName).value;
  if (text.trim() === '') return alert('Écris une note d\'abord');
  text = calculAuto(type, text);
  const date = new Date().toLocaleDateString('fr-FR') + ' ' + new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
  const note = {date: date, text: text, id: Date.now(), timestamp: Date.now()};
  let notes = JSON.parse(localStorage.getItem('khelcom_' + type)) || [];
  notes.unshift(note);
  localStorage.setItem('khelcom_' + type, JSON.stringify(notes));
  document.getElementById('note' + typeName).value = '';
  loadNotes(); updateDashboard(); dessinerGraph();
}

function calculAuto(type, text) {
  if(type === 'poulets') {
    let arrivee = parseInt(text.match(/arrivée[:\s]*(\d+)/i)?.[1] || 0);
    let mortalite = parseInt(text.match(/mortalité[:\s]*(\d+)/i)?.[1] || 0);
    let vendu = parseInt(text.match(/vendu[:\s]*(\d+)/i)?.[1] || 0);
    if(arrivee > 0 || mortalite > 0 || vendu > 0) text += `\n✅ Stock actuel: ${arrivee - mortalite - vendu} poulets`;
  }
  if(type === 'aliment') {
    let recu = parseInt(text.match(/reçu[:\s]*(\d+)/i)?.[1] || 0);
    let donne = parseInt(text.match(/donné[:\s]*(\d+)/i)?.[1] || 0);
    if(recu > 0 || donne > 0) text += `\n✅ Reste en stock: ${recu - donne} sacs`;
  }
  if(type === 'ventes') {
    let qte = parseInt(text.match(/qt[ée]?[:\s]*(\d+)/i)?.[1] || 0);
    let prix = parseInt(text.match(/prix[:\s]*(\d+)/i)?.[1] || 0);
    if(qte > 0 && prix > 0) text += `\n✅ Total vente: ${(qte * prix).toLocaleString('fr-FR')} F CFA`;
  }
  if(type === 'depenses' || type === 'sante') {
    let montants = text.match(/(\d+)\s*F/gi) || []; let total = 0; montants.forEach(m => total += parseInt(m));
    if(total > 0) text += `\n✅ Total: ${total.toLocaleString('fr-FR')} F CFA`;
  }
  return text;
}

function loadNotes() {
  ['poulets', 'aliment', 'ventes', 'sante', 'depenses', 'notes'].forEach(type => {
    let notes = JSON.parse(localStorage.getItem('khelcom_' + type)) || [];
    let html = '';
    notes.forEach(n => {
      html += `<div class="note"><div class="date">${n.date}</div>${n.text.replace(/\n/g, '<br>')}<div class="btn-actions"><button class="btn-edit" onclick="editNote('${type}', ${n.id})">✏️ Modifier</button><button class="btn-delete" onclick="deleteNote('${type}', ${n.id})">🗑️ Supprimer</button></div></div>`;
    });
    const typeName = type.charAt(0).toUpperCase() + type.slice(1);
    document.getElementById('list' + typeName).innerHTML = html;
  });
}

function deleteNote(type, id) {
  if(confirm("Supprimer cette note?")) {
    let notes = JSON.parse(localStorage.getItem('khelcom_' + type)) || [];
    notes = notes.filter(n => n.id!== id);
    localStorage.setItem('khelcom_' + type, JSON.stringify(notes));
    loadNotes(); updateDashboard(); dessinerGraph();
  }
}

function vider(type) {
  if(confirm("Vider TOUTE la section?")) {
    localStorage.removeItem('khelcom_' + type);
    loadNotes(); updateDashboard(); dessinerGraph();
  }
}

function editNote(type, id) {
  let notes = JSON.parse(localStorage.getItem('khelcom_' + type)) || [];
  let note = notes.find(n => n.id === id);
  let newText = prompt("Modifier la note:", note.text.replace(/✅.*/g, ''));
  if(newText!== null && newText.trim()!== '') {
    note.text = calculAuto(type, newText);
    localStorage.setItem('khelcom_' + type, JSON.stringify(notes));
    loadNotes(); updateDashboard(); dessinerGraph();
  }
}

function updateDashboard() {
  let ventes = JSON.parse(localStorage.getItem('khelcom_ventes')) || [];
  let depenses = JSON.parse(localStorage.getItem('khelcom_depenses')) || [];
  let poulets = JSON.parse(localStorage.getItem('khelcom_poulets')) || [];
  let moisActuel = new Date().getMonth(); let anneeActuelle = new Date().getFullYear();
  let totalVentes = 0; ventes.forEach(n => {let d = new Date(n.timestamp); if(d.getMonth() === moisActuel && d.getFullYear() === anneeActuelle) {let match = n.text.match(/Total vente: ([\d\s]+) F/); if(match) totalVentes += parseInt(match[1].replace(/\s/g, ''));}});
  let totalDepenses = 0; depenses.forEach(n => {let d = new Date(n.timestamp); if(d.getMonth() === moisActuel && d.getFullYear() === anneeActuelle) {let match = n.text.match(/Total: ([\d\s]+) F/); if(match) totalDepenses += parseInt(match[1].replace(/\s/g, ''));}});
  let benefice = totalVentes - totalDepenses;
  let dernierTotal = 0; if(poulets.length > 0) {let match = poulets[0].text.match(/Stock actuel: (\d+) poulets/); if(match) dernierTotal = parseInt(match[1]);}
  document.getElementById('dashboard').innerHTML = `<div class="card"><h4>🐔 Stock Poulets</h4><p>${dernierTotal}</p></div><div class="card"><h4>💵 Ventes Mois</h4><p>${totalVentes.toLocaleString('fr-FR')} F CFA</p></div><div class="card"><h4>💰 Dépenses Mois</h4><p>${totalDepenses.toLocaleString('fr-FR')} F CFA</p></div><div class="card"><h4>📊 Bénéfice</h4><p style="color:${benefice >= 0? 'var(--vert)' : 'var(--rouge)'}">${benefice.toLocaleString('fr-FR')} F CFA</p></div>`;
}

// GRAPHIQUE CORRIGÉ EN FCFA
function dessinerGraph() {
  let ventes = JSON.parse(localStorage.getItem('khelcom_ventes')) || [];
  let ctx = document.getElementById('graphVentes').getContext('2d');
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  let data = ventes.slice(0, 7).reverse().map(n => {let match = n.text.match(/Total vente: ([\d\s]+) F/); return match? parseInt(match[1].replace(/\s/g, '')) : 0;});
  let labels = ventes.slice(0, 7).reverse().map(n => n.date.split(' ')[0]);
  ctx.fillStyle = '#2E7D32'; ctx.font = "12px Arial"; ctx.fillText("7 Dernières Ventes en F CFA", 10, 15);
  let max = Math.max(...data, 1);
  data.forEach((val, i) => {
    let barHeight = (val / max) * 150;
    ctx.fillRect(20 + i * 45, 180 - barHeight, 30, barHeight);
    ctx.fillStyle = '#555'; ctx.fillText((val/1000).toFixed(0)+'k', 15 + i * 45, 175 - barHeight);
    ctx.fillText(labels[i], 15 + i * 45, 195);
    ctx.fillStyle = '#2E7D32';
  });
}

// EXPORT PDF SIMPLE
function exportPDF(type) {
  let notes = JSON.parse(localStorage.getItem('khelcom_' + type)) || [];
  let contenu = `RAPPORT KHELCOM - ${type.toUpperCase()}\nDate: ${new Date().toLocaleDateString('fr-FR')}\n\n`;
  notes.forEach(n => contenu += `${n.date}\n${n.text}\n------------------------\n`);
  let blob = new Blob([contenu], {type: 'text/plain'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Khelcom_${type}_${Date.now()}.txt`;
  a.click();
}

// SAUVEGARDE TOTALE
function exporterTout() {
  let tout = {};
  ['poulets', 'aliment', 'ventes', 'sante', 'depenses', 'notes'].forEach(t => {
    tout[t] = JSON.parse(localStorage.getItem('khelcom_' + t)) || [];
  });
  let blob = new Blob([JSON.stringify(tout)], {type: 'application/json'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Sauvegarde_Khelcom_${Date.now()}.json`;
  a.click();
  alert('Sauvegarde complète téléchargée!');
}

loadNotes(); updateDashboard(); dessinerGraph();
</script>
</body>
</html>
